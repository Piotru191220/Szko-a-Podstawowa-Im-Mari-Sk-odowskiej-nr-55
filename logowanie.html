<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1257bd;
        }

        #message {
            margin-top: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1769e0;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Logowanie</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Hasło"
            required
        >

        <button type="submit">
            Zaloguj się
        </button>

        <p id="message"></p>

    </form>

    <a class="back" href="index.html">
        ← Wróć na stronę główną
    </a>

</div>

<script>
    const SUPABASE_URL = "https://vqilsuvpinnfmngrczlj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Logowanie...";
        message.style.color = "black";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            message.textContent = error.message;
            message.style.color = "red";
            return;
        }

        message.textContent = "Zalogowano pomyślnie!";
        message.style.color = "green";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);

    });
</script>

</body>
</html>
