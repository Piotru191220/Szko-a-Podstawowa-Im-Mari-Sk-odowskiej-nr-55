<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie | Szkoła Podstawowa nr 55</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #2878e8;
    --blue-dark: #185cc0;
    --yellow: #ffca4b;
    --coral: #ff806e;
    --green: #35b98a;
    --text: #263653;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 10% 15%, #fff0b8 0, transparent 25%),
        radial-gradient(circle at 90% 80%, #c9f5e5 0, transparent 28%),
        linear-gradient(135deg, #eaf3ff, #fff8ec);
    display: flex;
    flex-direction: column;
}

header {
    padding: 22px 20px;
    text-align: center;
}

.school-name {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 17px;
    font-weight: bold;
}

.mini-logo {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    box-shadow: 0 5px 15px #1b4d871c;
    font-size: 27px;
}

main {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 20px;
}

.login-card {
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 28px;
    padding: 34px;
    box-shadow: 0 18px 55px rgba(46, 83, 137, 0.13);
}

.logo-area {
    text-align: center;
    margin-bottom: 22px;
}

.logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 18px;
    border-radius: 32px;
    background: linear-gradient(145deg, #fff0b8, #ffe1a0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    box-shadow: 0 8px 20px rgba(240, 174, 42, 0.18);
    transform: rotate(-3deg);
}

h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -0.7px;
}

.subtitle {
    color: #71809a;
    margin: 10px 0 0;
    line-height: 1.5;
    font-size: 14px;
}

.decoration {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 17px 0 24px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
}

.dot:nth-child(1) { background: var(--blue); }
.dot:nth-child(2) { background: var(--yellow); }
.dot:nth-child(3) { background: var(--coral); }
.dot:nth-child(4) { background: var(--green); }

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin: 18px 0 8px;
}

input {
    width: 100%;
    padding: 14px 15px;
    border: 2px solid #e5ebf4;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    color: var(--text);
    background: #fbfcff;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(40,120,232,0.1);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 80px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--blue-dark);
    font-weight: bold;
    cursor: pointer;
    padding: 8px 5px;
}

.login-button {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, var(--blue), #5799f5);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 17px rgba(40,120,232,0.24);
    transition: transform 0.2s, box-shadow 0.2s;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(40,120,232,0.3);
}

.login-button:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
}

.message {
    display: none;
    margin-top: 17px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.message.error {
    display: block;
    background: #fff0ef;
    color: #b42318;
}

.message.success {
    display: block;
    background: #e9fbf3;
    color: #13764e;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    text-decoration: none;
    color: #667791;
    font-size: 14px;
    font-weight: bold;
}

.back-link:hover {
    color: var(--blue);
}

footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #7d8aa0;
}

@media (max-width: 480px) {
    header {
        padding: 17px 12px;
    }

    .school-name {
        font-size: 14px;
    }

    .mini-logo {
        width: 42px;
        height: 42px;
        font-size: 23px;
    }

    main {
        padding: 12px;
    }

    .login-card {
        padding: 25px 21px;
        border-radius: 23px;
    }

    h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="school-name">
        <div class="mini-logo" aria-hidden="true">📚</div>
        <span>Szkoła Podstawowa nr 55</span>
    </div>
</header>

<main>
    <section class="login-card">

        <div class="logo-area">
            <div class="logo" role="img" aria-label="Książki szkolne">📚</div>

            <h1>Witaj ponownie!</h1>

            <p class="subtitle">
                Zaloguj się do szkolnego portalu
            </p>

            <div class="decoration" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <form id="loginForm">
            <label for="email">Adres e-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="np. uczen@example.com"
                autocomplete="username"
                required
            >

            <label for="password">Hasło</label>
            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Wpisz swoje hasło"
                    autocomplete="current-password"
                    required
                >
                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Pokaż hasło"
                    aria-pressed="false"
                >Pokaż</button>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                🔑 Zaloguj się
            </button>

            <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>

        <a href="index.html" class="back-link">
            ← Wróć na stronę główną
        </a>

    </section>
</main>

<footer>
    © Szkoła Podstawowa nr 55
</footer>

<script>
// ==========================================
// KONFIGURACJA SUPABASE
// ==========================================

const SUPABASE_URL = "https://vqilsuvpinnfmngrczlj.supabase.co";
const SUPABASE_KEY = "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";
const ADMIN_EMAIL = "pi.pu2@op.pl";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ==========================================
// ELEMENTY STRONY
// ==========================================

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const togglePassword = document.getElementById("togglePassword");
const message = document.getElementById("message");

// ==========================================
// KOMUNIKATY
// ==========================================

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

// ==========================================
// POKAŻ / UKRYJ HASŁO
// ==========================================

togglePassword.addEventListener("click", function() {
    const show = passwordInput.type === "password";

    passwordInput.type = show ? "text" : "password";
    togglePassword.textContent = show ? "Ukryj" : "Pokaż";
    togglePassword.setAttribute("aria-label", show ? "Ukryj hasło" : "Pokaż hasło");
    togglePassword.setAttribute("aria-pressed", String(show));
});

// ==========================================
// SPRAWDZENIE AKTUALNEJ SESJI
// ==========================================

async function checkExistingSession() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
        console.error("Błąd sprawdzania sesji:", error);
        return;
    }

    if (!data.session || !data.session.user) {
        return;
    }

    const userEmail = (data.session.user.email || "").toLowerCase();

    if (userEmail === ADMIN_EMAIL.toLowerCase()) {
        window.location.replace("admin.html");
    } else {
        window.location.replace("index.html");
    }
}

// ==========================================
// LOGOWANIE
// ==========================================

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage("Wpisz adres e-mail i hasło.", "error");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "⏳ Logowanie...";
    message.className = "message";

    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            console.error("Błąd logowania:", error);
            showMessage(
                "Nie udało się zalogować. Sprawdź adres e-mail i hasło.",
                "error"
            );
            return;
        }

        if (!data.user) {
            showMessage("Nie udało się potwierdzić konta. Spróbuj ponownie.", "error");
            return;
        }

        const userEmail = (data.user.email || "").toLowerCase();

        showMessage("✅ Zalogowano! Przekierowywanie...", "success");

        if (userEmail === ADMIN_EMAIL.toLowerCase()) {
            window.location.replace("admin.html");
        } else {
            window.location.replace("index.html");
        }

    } catch (error) {
        console.error("Nieoczekiwany błąd:", error);
        showMessage("Wystąpił błąd połączenia. Spróbuj ponownie.", "error");
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "🔑 Zaloguj się";
    }
});

// ==========================================
// START
// ==========================================

checkExistingSession();
</script>

</body>
</html>
```
