<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Panel administratora | Szkoła Podstawowa nr 55
    </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            color: #222;
        }


        header {

            background:
                linear-gradient(
                    135deg,
                    #1769e0,
                    #4c8ff5
                );

            color: white;

            text-align: center;

            padding: 40px 20px;
        }


        header h1 {
            margin: 0 0 10px;
        }


        main {

            max-width: 900px;

            margin: 40px auto;

            padding: 20px;
        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }


        label {

            display: block;

            margin-top: 15px;

            font-weight: bold;
        }


        input,
        textarea {

            width: 100%;

            padding: 13px;

            margin-top: 8px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            font-family: Arial, sans-serif;
        }


        textarea {

            min-height: 130px;

            resize: vertical;
        }


        button {

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }


        .add-button {

            width: 100%;

            padding: 13px;

            background: #1769e0;

            color: white;
        }


        .add-button:hover {

            background: #1257bd;
        }


        .message {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;
        }


        /* =================================
           AKTUALNOŚCI
        ================================= */

        .news-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 18px;

            margin-top: 12px;

            background: #f4f7fb;

            border-radius: 10px;
        }


        .news-info {

            flex: 1;
        }


        .news-title {

            font-weight: bold;

            color: #1769e0;

            font-size: 18px;
        }


        .news-content {

            margin-top: 8px;

            line-height: 1.5;

            white-space: pre-wrap;
        }


        .news-date {

            margin-top: 8px;

            color: #777;

            font-size: 13px;
        }


        .delete-button {

            background: #d93025;

            color: white;

            padding: 9px 13px;

            white-space: nowrap;
        }


        .delete-button:hover {

            background: #b9231b;
        }


        /* =================================
           MATERIAŁY
        ================================= */

        .material-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 15px;

            margin-top: 10px;

            background: #f4f7fb;

            border-radius: 10px;
        }


        .material-info {

            flex: 1;
        }


        .material-title {

            font-weight: bold;

            color: #1769e0;
        }


        .material-subject {

            font-size: 14px;

            color: #666;

            margin-top: 5px;
        }


        .empty {

            color: #777;

            padding: 10px 0;
        }


        .loading {

            color: #1769e0;
        }


        /* =================================
           POWRÓT
        ================================= */

        .back-button {

            display: block;

            text-align: center;

            text-decoration: none;

            background: #1769e0;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-weight: bold;
        }


        .back-button:hover {

            background: #1257bd;
        }


        @media (max-width: 600px) {

            .news-item,
            .material-item {

                flex-direction: column;

                align-items: stretch;
            }


            .delete-button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        👨‍💼 Panel administratora
    </h1>

    <p>
        Zarządzanie aktualnościami i materiałami
    </p>

</header>


<main>


    <!-- =====================================
         AKTUALNOŚĆ
    ====================================== -->

    <div class="box">

        <h2>
            📢 Dodaj aktualność
        </h2>


        <label for="newsTitle">
            Tytuł aktualności
        </label>

        <input
            type="text"
            id="newsTitle"
            placeholder="np. Apel szkolny"
        >


        <label for="newsContent">
            Treść aktualności
        </label>

        <textarea
            id="newsContent"
            placeholder="np. Dziś na 7. lekcji będzie apel."
        ></textarea>


        <button
            class="add-button"
            id="addNewsButton">

            📢 Dodaj aktualność

        </button>


        <div
            id="newsMessage"
            class="message">
        </div>

    </div>


    <!-- =====================================
         LISTA AKTUALNOŚCI
    ====================================== -->

    <div class="box">

        <h2>
            📢 Wszystkie aktualności
        </h2>


        <div id="newsList">

            <div class="loading">
                Ładowanie aktualności...
            </div>

        </div>

    </div>


    <!-- =====================================
         DODAWANIE MATERIAŁU
    ====================================== -->

    <div class="box">

        <h2>
            ➕ Dodaj materiał
        </h2>


        <label for="subject">
            Przedmiot
        </label>


        <select
            id="subject"
            style="
                width:100%;
                padding:13px;
                margin-top:8px;
                margin-bottom:18px;
                border:1px solid #ccc;
                border-radius:8px;
                font-size:16px;
            "
        >

            <option value="Matematyka">
                📐 Matematyka
            </option>

            <option value="Język polski">
                📖 Język polski
            </option>

            <option value="Język angielski">
                🇬🇧 Język angielski
            </option>

            <option value="Przyroda">
                🧪 Przyroda
            </option>

            <option value="Informatyka">
                💻 Informatyka
            </option>

            <option value="Inne">
                📚 Inne
            </option>

        </select>


        <label for="title">
            Nazwa materiału
        </label>


        <input
            type="text"
            id="title"
            placeholder="np. Zadania z ułamków"
        >


        <label for="file">
            Plik
        </label>


        <input
            type="file"
            id="file"
            accept=".pdf,.doc,.docx,.ppt,.pptx"
        >


        <button
            class="add-button"
            id="addButton">

            ➕ Dodaj materiał

        </button>


        <p
            id="message"
            class="message">
        </p>

    </div>


    <!-- =====================================
         MATERIAŁY
    ====================================== -->

    <div class="box">

        <h2>
            📚 Wszystkie materiały
        </h2>


        <div id="materialsList">

            <div class="loading">
                Ładowanie materiałów...
            </div>

        </div>

    </div>


    <!-- =====================================
         POWRÓT
    ====================================== -->

    <div class="box">

        <a
            href="index.html"
            class="back-button">

            ← Powrót na stronę główną

        </a>

    </div>


</main>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://vqilsuvpinnfmngrczlj.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";


const ADMIN_EMAIL =
    "pi.pu2@op.pl";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// SPRAWDZENIE ADMINA
// ==========================================

async function checkUser() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "logowanie.html";

        return false;
    }


    const email =
        session.user.email;


    if (
        email !== ADMIN_EMAIL
    ) {

        document.body.innerHTML = `

            <h1
                style="
                    text-align:center;
                    margin-top:100px;
                "
            >
                🚫 Brak dostępu
            </h1>

            <p
                style="
                    text-align:center;
                "
            >
                Ta strona jest tylko dla administratora.
            </p>

            <p
                style="
                    text-align:center;
                "
            >
                <a href="index.html">
                    Wróć na stronę główną
                </a>
            </p>

        `;

        return false;
    }


    return true;
}


// ==========================================
// AKTUALNOŚCI — POBIERANIE
// ==========================================

async function loadNews() {

    const list =
        document.getElementById(
            "newsList"
        );


    list.innerHTML =
        '<div class="loading">Ładowanie aktualności...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("news")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        list.innerHTML =
            '<div class="empty">❌ Nie udało się pobrać aktualności.</div>';

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">Brak aktualności.</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(news => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "news-item";


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "news-info";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "news-title";


        title.textContent =
            "📢 " + news.title;


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "news-content";


        content.textContent =
            news.content;


        const date =
            document.createElement(
                "div"
            );


        date.className =
            "news-date";


        if (news.created_at) {

            date.textContent =
                "Dodano: " +
                new Date(
                    news.created_at
                ).toLocaleString(
                    "pl-PL",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                );

        }


        info.appendChild(title);

        info.appendChild(content);

        info.appendChild(date);


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "delete-button";


        deleteButton.textContent =
            "🗑️ Usuń";


        deleteButton.addEventListener(
            "click",
            function() {

                deleteNews(
                    news.id,
                    news.title
                );

            }
        );


        item.appendChild(info);

        item.appendChild(deleteButton);


        list.appendChild(item);

    });

}


// ==========================================
// AKTUALNOŚCI — DODAWANIE
// ==========================================

document
    .getElementById(
        "addNewsButton"
    )
    .addEventListener(
        "click",
        async function() {


            const titleInput =
                document.getElementById(
                    "newsTitle"
                );


            const contentInput =
                document.getElementById(
                    "newsContent"
                );


            const message =
                document.getElementById(
                    "newsMessage"
                );


            const title =
                titleInput.value.trim();


            const content =
                contentInput.value.trim();


            if (
                !title ||
                !content
            ) {

                message.textContent =
                    "❌ Wpisz tytuł i treść aktualności.";

                message.style.color =
                    "red";

                return;
            }


            message.textContent =
                "⏳ Dodawanie aktualności...";

            message.style.color =
                "#1769e0";


            const {
                error
            } =
                await supabaseClient
                    .from("news")
                    .insert({

                        title: title,

                        content: content

                    });


            if (error) {

                console.error(error);


                message.textContent =
                    "❌ Błąd: " +
                    error.message;

                message.style.color =
                    "red";

                return;
            }


            message.textContent =
                "✅ Aktualność została dodana!";

            message.style.color =
                "green";


            titleInput.value =
                "";


            contentInput.value =
                "";


            loadNews();

        }
    );


// ==========================================
// AKTUALNOŚCI — USUWANIE
// ==========================================

async function deleteNews(
    id,
    title
) {


    const confirmed =
        confirm(
            'Czy na pewno chcesz usunąć aktualność "' +
            title +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("news")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "❌ Nie udało się usunąć aktualności:\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Aktualność została usunięta."
    );


    loadNews();

}


// ==========================================
// MATERIAŁY — POBIERANIE
// ==========================================

async function loadMaterials() {

    const list =
        document.getElementById(
            "materialsList"
        );


    list.innerHTML =
        '<div class="loading">Ładowanie materiałów...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("materials")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        list.innerHTML =
            '<div class="empty">❌ Nie udało się pobrać materiałów.</div>';

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">Brak materiałów.</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(material => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "material-item";


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "material-info";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "material-title";


        title.textContent =
            "📄 " +
            material.title;


        const subject =
            document.createElement(
                "div"
            );


        subject.className =
            "material-subject";


        subject.textContent =
            "Przedmiot: " +
            material.subject;


        info.appendChild(title);

        info.appendChild(subject);


        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.className =
            "delete-button";


        deleteButton.textContent =
            "🗑️ Usuń";


        deleteButton.addEventListener(
            "click",
            function() {

                deleteMaterial(
                    material.id,
                    material.file_url,
                    material.title
                );

            }
        );


        item.appendChild(info);

        item.appendChild(deleteButton);


        list.appendChild(item);

    });

}


// ==========================================
// MATERIAŁY — USUWANIE
// ==========================================

async function deleteMaterial(
    id,
    filePath,
    title
) {


    const confirmed =
        confirm(
            'Czy na pewno chcesz usunąć materiał "' +
            title +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    const {
        error: storageError
    } =
        await supabaseClient
            .storage
            .from("materials")
            .remove([
                filePath
            ]);


    if (storageError) {

        alert(
            "❌ Nie udało się usunąć pliku:\n" +
            storageError.message
        );

        return;
    }


    const {
        error: databaseError
    } =
        await supabaseClient
            .from("materials")
            .delete()
            .eq(
                "id",
                id
            );


    if (databaseError) {

        alert(
            "❌ Nie udało się usunąć wpisu:\n" +
            databaseError.message
        );

        return;
    }


    alert(
        "✅ Materiał został usunięty."
    );


    loadMaterials();

}


// ==========================================
// MATERIAŁY — DODAWANIE
// ==========================================

document
    .getElementById(
        "addButton"
    )
    .addEventListener(
        "click",
        async function() {


            const message =
                document.getElementById(
                    "message"
                );


            const subject =
                document.getElementById(
                    "subject"
                ).value;


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const file =
                document.getElementById(
                    "file"
                ).files[0];


            if (
                !title ||
                !file
            ) {

                message.textContent =
                    "Uzupełnij nazwę i wybierz plik.";

                message.style.color =
                    "red";

                return;
            }


            message.textContent =
                "⏳ Przesyłanie pliku...";

            message.style.color =
                "black";


            const safeFileName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const fileName =
                Date.now() +
                "_" +
                safeFileName;


            const filePath =
                fileName;


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("materials")
                    .upload(
                        filePath,
                        file
                    );


            if (uploadError) {

                message.textContent =
                    "❌ Błąd przesyłania: " +
                    uploadError.message;

                message.style.color =
                    "red";

                return;
            }


            const {
                error: databaseError
            } =
                await supabaseClient
                    .from("materials")
                    .insert({

                        title: title,

                        subject: subject,

                        file_url: filePath

                    });


            if (databaseError) {


                await supabaseClient
                    .storage
                    .from("materials")
                    .remove([
                        filePath
                    ]);


                message.textContent =
                    "❌ Błąd bazy danych: " +
                    databaseError.message;

                message.style.color =
                    "red";

                return;
            }


            message.textContent =
                "✅ Materiał został dodany!";

            message.style.color =
                "green";


            document.getElementById(
                "title"
            ).value = "";


            document.getElementById(
                "file"
            ).value = "";


            loadMaterials();

        }
    );


// ==========================================
// START
// ==========================================

async function start() {


    const isAdmin =
        await checkUser();


    if (!isAdmin) {
        return;
    }


    await loadNews();

    await loadMaterials();

}


start();


</script>


</body>

</html>
