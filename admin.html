<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel administratora</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 16px;
        }

        #addButton {
            background: #1769e0;
            color: white;
            width: 100%;
        }

        #addButton:hover {
            background: #0d55bd;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .materials {
            margin-top: 35px;
        }

        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f7f7f7;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .material-info {
            flex: 1;
        }

        .material-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .material-subject {
            color: #666;
        }

        .delete-button {
            background: #dc3545;
            color: white;
        }

        .delete-button:hover {
            background: #b02a37;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 20px;
            color: #666;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🔐 Panel administratora</h1>


    <!-- DODAWANIE MATERIAŁU -->

    <h2>Dodaj materiał</h2>

    <div class="form-group">

        <label for="subject">
            Przedmiot
        </label>

        <select id="subject">

            <option value="Matematyka">
                Matematyka
            </option>

            <option value="Język polski">
                Język polski
            </option>

            <option value="Język angielski">
                Język angielski
            </option>

            <option value="Historia">
                Historia
            </option>

            <option value="Biologia">
                Biologia
            </option>

            <option value="Chemia">
                Chemia
            </option>

            <option value="Fizyka">
                Fizyka
            </option>

            <option value="Geografia">
                Geografia
            </option>

            <option value="Informatyka">
                Informatyka
            </option>

            <option value="Inne">
                Inne
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="title">
            Nazwa materiału
        </label>

        <input
            type="text"
            id="title"
            placeholder="Np. Zadania z matematyki"
        >

    </div>


    <div class="form-group">

        <label for="file">
            Plik
        </label>

        <input
            type="file"
            id="file"
        >

    </div>


    <button id="addButton">
        ➕ Dodaj materiał
    </button>


    <p id="message"></p>


    <!-- LISTA MATERIAŁÓW -->

    <div class="materials">

        <h2>📚 Dodane materiały</h2>

        <div id="materialsList">

            <div class="loading">
                Ładowanie materiałów...
            </div>

        </div>

    </div>

</div>


<script>

// ======================================================
// SUPABASE
// ======================================================

const SUPABASE_URL =
    "https://vqilsuvpinnfmngrczlj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// EMAIL ADMINISTRATORA
// ======================================================
//
// TUTAJ WPISZ SWÓJ PRAWDZIWY EMAIL
// taki sam, jak konto używane do logowania.
//
// PRZYKŁAD:
// const allowedEmail = "jan.kowalski@gmail.com";
//
// ======================================================

const allowedEmail =
    "pi.pu2@op.pl";


// ======================================================
// SPRAWDZENIE UŻYTKOWNIKA
// ======================================================

async function checkUser() {

    const {
        data: { user },
        error
    } =
        await supabaseClient.auth.getUser();


    console.log(
        "Zalogowany użytkownik:",
        user
    );


    console.log(
        "Błąd logowania:",
        error
    );


    // Brak użytkownika

    if (error || !user) {

        window.location.href =
            "logowanie.html";

        return false;
    }


    // Sprawdzenie emaila

    const userEmail =
        (user.email || "")
            .trim()
            .toLowerCase();


    const adminEmail =
        allowedEmail
            .trim()
            .toLowerCase();


    console.log(
        "Email użytkownika:",
        userEmail
    );


    console.log(
        "Dozwolony email:",
        adminEmail
    );


    // Brak dostępu

    if (
        !userEmail ||
        userEmail !== adminEmail
    ) {

        document.body.innerHTML = `

            <div style="
                max-width:600px;
                margin:100px auto;
                padding:30px;
                text-align:center;
                font-family:Arial,sans-serif;
                background:white;
                border-radius:15px;
                box-shadow:0 5px 20px rgba(0,0,0,0.1);
            ">

                <h1>
                    🚫 Brak dostępu
                </h1>

                <p>
                    To konto nie ma uprawnień administratora.
                </p>

                <p>
                    Zalogowane konto:
                </p>

                <strong>
                    ${user.email || "brak adresu"}
                </strong>

                <br><br>

                <a href="index.html">
                    ← Wróć na stronę główną
                </a>

            </div>

        `;

        return false;
    }


    console.log(
        "✅ Administrator został rozpoznany."
    );


    return true;
}


// ======================================================
// POBIERANIE MATERIAŁÓW
// ======================================================

async function loadMaterials() {

    const list =
        document.getElementById(
            "materialsList"
        );


    if (!list) {

        console.error(
            "Nie znaleziono elementu #materialsList"
        );

        return;
    }


    list.innerHTML =
        '<div class="loading">Ładowanie materiałów...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("materials")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    // Błąd pobierania

    if (error) {

        console.error(
            "Błąd pobierania materiałów:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                ❌ Nie udało się pobrać materiałów.

                <br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

        return;
    }


    // Brak materiałów

    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">Brak materiałów.</div>';

        return;
    }


    list.innerHTML = "";


    // Tworzenie listy

    data.forEach(
        material => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "material-item";


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "material-info";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "material-title";


            title.textContent =
                "📄 " +
                (
                    material.title ||
                    "Bez nazwy"
                );


            const subject =
                document.createElement(
                    "div"
                );


            subject.className =
                "material-subject";


            subject.textContent =
                "Przedmiot: " +
                (
                    material.subject ||
                    "Nie podano"
                );


            info.appendChild(
                title
            );


            info.appendChild(
                subject
            );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete-button";


            deleteButton.textContent =
                "🗑️ Usuń";


            deleteButton.addEventListener(
                "click",
                function () {

                    deleteMaterial(
                        material.id,
                        material.file_url,
                        material.title
                    );

                }
            );


            item.appendChild(
                info
            );


            item.appendChild(
                deleteButton
            );


            list.appendChild(
                item
            );

        }
    );
}


// ======================================================
// USUWANIE MATERIAŁU
// ======================================================

async function deleteMaterial(id, filePath, title) {

    const confirmed = confirm(
        'Czy na pewno chcesz usunąć materiał "' +
        title +
        '"?'
    );

    if (!confirmed) {
        return;
    }

    console.log("USUWANIE:");
    console.log("ID:", id);
    console.log("FILE:", filePath);


    // ==========================================
    // 1. USUNIĘCIE PLIKU ZE STORAGE
    // ==========================================

    if (filePath) {

        const { data: storageData, error: storageError } =
            await supabaseClient
                .storage
                .from("materials")
                .remove([filePath]);

        console.log("Storage:", storageData);
        console.log("Storage error:", storageError);

        if (storageError) {

            alert(
                "❌ Błąd usuwania pliku:\n\n" +
                storageError.message
            );

            return;
        }
    }


    // ==========================================
    // 2. USUNIĘCIE REKORDU Z TABELI
    // ==========================================

    const { data: deletedData, error: databaseError } =
        await supabaseClient
            .from("materials")
            .delete()
            .eq("id", id)
            .select();

    console.log("Usunięty rekord:", deletedData);
    console.log("Database error:", databaseError);


    if (databaseError) {

        alert(
            "❌ Błąd usuwania materiału z bazy:\n\n" +
            databaseError.message
        );

        return;
    }


    // ==========================================
    // 3. SPRAWDZENIE CZY REKORD FAKTYCZNIE ZNIKNĄŁ
    // ==========================================

    if (!deletedData || deletedData.length === 0) {

        alert(
            "❌ Materiał NIE został usunięty z bazy.\n\n" +
            "Najprawdopodobniej tabela materials ma " +
            "blokadę RLS dla DELETE."
        );

        console.error(
            "DELETE zwrócił 0 rekordów."
        );

        return;
    }


    // ==========================================
    // 4. SUKCES
    // ==========================================

    alert(
        "✅ Materiał został usunięty."
    );


    await loadMaterials();
}

// ======================================================
// DODAWANIE MATERIAŁU
// ======================================================

async function addMaterial() {

    const message =
        document.getElementById(
            "message"
        );


    const subject =
        document.getElementById(
            "subject"
        ).value;


    const title =
        document.getElementById(
            "title"
        )
        .value
        .trim();


    const fileInput =
        document.getElementById(
            "file"
        );


    const file =
        fileInput.files[0];


    // --------------------------------------------------
    // SPRAWDZENIE NAZWY
    // --------------------------------------------------

    if (!title) {

        message.textContent =
            "❌ Wpisz nazwę materiału.";

        message.style.color =
            "red";

        return;
    }


    // --------------------------------------------------
    // SPRAWDZENIE PLIKU
    // --------------------------------------------------

    if (!file) {

        message.textContent =
            "❌ Wybierz plik.";

        message.style.color =
            "red";

        return;
    }


    // --------------------------------------------------
    // KOMUNIKAT
    // --------------------------------------------------

    message.textContent =
        "⏳ Przesyłanie pliku...";

    message.style.color =
        "#1769e0";


    // --------------------------------------------------
    // BEZPIECZNA NAZWA PLIKU
    // --------------------------------------------------

    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const filePath =
        Date.now() +
        "_" +
        safeName;


    console.log(
        "Przesyłanie pliku:",
        filePath
    );


    // --------------------------------------------------
    // UPLOAD DO STORAGE
    // --------------------------------------------------

    const {
        error: uploadError
    } =
        await supabaseClient
            .storage
            .from("materials")
            .upload(
                filePath,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    // Błąd uploadu

    if (uploadError) {

        console.error(
            "Błąd Storage:",
            uploadError
        );


        message.textContent =
            "❌ Błąd przesyłania: " +
            uploadError.message;


        message.style.color =
            "red";


        return;
    }


    // --------------------------------------------------
    // ZAPIS DO TABELI MATERIALS
    // --------------------------------------------------

    message.textContent =
        "⏳ Zapisywanie materiału...";


    const {
        error: databaseError
    } =
        await supabaseClient
            .from("materials")
            .insert({

                title:
                    title,

                subject:
                    subject,

                file_url:
                    filePath

            });


    // Błąd bazy

    if (databaseError) {

        console.error(
            "Błąd bazy:",
            databaseError
        );


        // Usunięcie pliku,
        // jeżeli zapis w bazie się nie udał.

        await supabaseClient
            .storage
            .from("materials")
            .remove([
                filePath
            ]);


        message.textContent =
            "❌ Błąd bazy danych: " +
            databaseError.message;


        message.style.color =
            "red";


        return;
    }


    // --------------------------------------------------
    // SUKCES
    // --------------------------------------------------

    message.textContent =
        "✅ Materiał został dodany!";


    message.style.color =
        "green";


    // Czyszczenie formularza

    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "file"
    ).value = "";


    // Odświeżenie listy

    await loadMaterials();
}


// ======================================================
// PRZYCISK DODAWANIA
// ======================================================

document
    .getElementById(
        "addButton"
    )
    .addEventListener(
        "click",
        addMaterial
    );


// ======================================================
// START PANELU
// ======================================================

async function start() {

    console.log(
        "Uruchamianie panelu administratora..."
    );


    const isAdmin =
        await checkUser();


    if (!isAdmin) {

        return;
    }


    await loadMaterials();
}


// Uruchomienie

start();

</script>

</body>

</html>
