<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sekretariat | Szkoła Podstawowa nr 55</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: linear-gradient(135deg, #1769e0, #4c8ff5);
    color: white;
    padding: 30px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

header h1 {
    margin: 0;
}

header p {
    margin: 6px 0 0;
    opacity: .9;
}

.logout-button {
    border: none;
    background: rgba(255,255,255,.18);
    color: white;
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.logout-button:hover {
    background: rgba(255,255,255,.28);
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.layout {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 20px;
}

.box {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.07);
    overflow: hidden;
}

.box-header {
    padding: 20px;
    border-bottom: 1px solid #e8edf4;
}

.box-header h2 {
    margin: 0;
    font-size: 20px;
}

.conversations {
    max-height: 650px;
    overflow-y: auto;
}

.conversation {
    padding: 17px;
    border-bottom: 1px solid #edf1f6;
    cursor: pointer;
    transition: .2s;
}

.conversation:hover {
    background: #f5f8fd;
}

.conversation.active {
    background: #e7f0ff;
    border-left: 4px solid #1769e0;
}

.conversation-name {
    font-weight: bold;
    color: #1769e0;
    margin-bottom: 5px;
}

.conversation-date {
    font-size: 12px;
    color: #777;
}

.empty {
    padding: 25px;
    text-align: center;
    color: #777;
}

.loading {
    padding: 25px;
    text-align: center;
    color: #1769e0;
}

.chat {
    display: flex;
    flex-direction: column;
    height: 700px;
}

.chat-header {
    padding: 20px;
    border-bottom: 1px solid #e8edf4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.chat-header h2 {
    margin: 0;
}

.chat-status {
    font-size: 13px;
    color: #18a88b;
    font-weight: bold;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #f8faff;
}

.message {
    max-width: 75%;
    padding: 12px 15px;
    border-radius: 14px;
    margin-bottom: 12px;
    word-wrap: break-word;
}

.message.student {
    background: white;
    border: 1px solid #e2e8f0;
    margin-right: auto;
}

.message.secretary {
    background: #1769e0;
    color: white;
    margin-left: auto;
}

.message-author {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
    opacity: .7;
}

.message-text {
    line-height: 1.45;
    white-space: pre-wrap;
}

.message-date {
    font-size: 10px;
    margin-top: 7px;
    opacity: .6;
}

.chat-input {
    padding: 15px;
    border-top: 1px solid #e8edf4;
    background: white;
    display: flex;
    gap: 10px;
}

.chat-input textarea {
    flex: 1;
    resize: none;
    min-height: 55px;
    max-height: 150px;
    padding: 12px;
    border: 1px solid #ccd6e5;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.send-button {
    border: none;
    background: #1769e0;
    color: white;
    padding: 0 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.send-button:hover {
    background: #1257bd;
}

.close-button {
    border: none;
    background: #d93025;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.close-button:hover {
    background: #b9231b;
}

.closed-message {
    padding: 15px;
    text-align: center;
    background: #fff3f2;
    color: #b42318;
    font-weight: bold;
}

.no-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #777;
    padding: 30px;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #1769e0;
    text-decoration: none;
    font-weight: bold;
}

@media(max-width: 800px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .conversations {
        max-height: 300px;
    }

    .chat {
        height: 650px;
    }

    .header-inner {
        flex-direction: column;
        text-align: center;
    }

    .message {
        max-width: 90%;
    }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div>

<h1>🏫 Sekretariat</h1>

<p>Panel obsługi rozmów z uczniami</p>

</div>

<button
    class="logout-button"
    id="logoutButton"
>
    🚪 Wyloguj
</button>

</div>

</header>


<main>

<div class="layout">


<!-- ============================= -->
<!-- LISTA ROZMÓW -->
<!-- ============================= -->

<div class="box">

<div class="box-header">

<h2>💬 Rozmowy</h2>

</div>

<div
    class="conversations"
    id="conversations"
>

<div class="loading">
    Ładowanie rozmów...
</div>

</div>

</div>


<!-- ============================= -->
<!-- CHAT -->
<!-- ============================= -->

<div class="box chat">

<div
    id="chatHeader"
    class="chat-header"
>

<div>

<h2 id="chatTitle">
    💬 Wybierz rozmowę
</h2>

<div
    id="chatStatus"
    class="chat-status"
>
</div>

</div>

<button
    id="closeConversationButton"
    class="close-button"
    style="display:none;"
>
    🔒 Zamknij rozmowę
</button>

</div>


<div
    id="messages"
    class="messages"
>

<div class="no-chat">

    <div>

        <div style="font-size:50px;">
            💬
        </div>

        <p>
            Wybierz rozmowę z listy.
        </p>

    </div>

</div>

</div>


<div
    id="closedMessage"
    class="closed-message"
    style="display:none;"
>
    🔒 Ta rozmowa została zamknięta.
</div>


<div
    id="chatInput"
    class="chat-input"
    style="display:none;"
>

<textarea
    id="messageInput"
    placeholder="Napisz odpowiedź..."
></textarea>

<button
    id="sendButton"
    class="send-button"
>
    Wyślij
</button>

</div>

</div>

</div>


<a
    class="back"
    href="index.html"
>
    ← Wróć na stronę główną
</a>

</main>


<script>

// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
    "https://vqilsuvpinnfmngrczlj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";

const ADMIN_EMAIL =
    "pi.pu2@op.pl";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==================================================
// ZMIENNE
// ==================================================

let currentConversationId = null;

let currentConversationClosed = false;


// ==================================================
// SPRAWDZENIE ADMINA
// ==================================================

async function checkAdmin() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Błąd sesji:",
            error
        );

        window.location.href =
            "logowanie.html";

        return false;
    }


    const session =
        data.session;


    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "logowanie.html";

        return false;
    }


    const email =
        session.user.email;


    if (
        email !== ADMIN_EMAIL
    ) {

        document.body.innerHTML = `

            <div style="
                text-align:center;
                margin-top:100px;
                font-family:Arial;
            ">

                <h1>
                    🚫 Brak dostępu
                </h1>

                <p>
                    Ta strona jest przeznaczona
                    tylko dla sekretariatu.
                </p>

                <p>
                    Zalogowane konto:
                    <strong>${escapeHtml(email)}</strong>
                </p>

                <p>
                    <a href="index.html">
                        ← Wróć na stronę główną
                    </a>
                </p>

            </div>

        `;

        return false;
    }


    return true;
}


// ==================================================
// POBIERANIE ROZMÓW
// ==================================================

async function loadConversations() {

    const list =
        document.getElementById(
            "conversations"
        );


    list.innerHTML =
        '<div class="loading">Ładowanie rozmów...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
        .from("help_conversations")
        .select("id, name, created_at, closed")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Błąd rozmów:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                ❌ Nie udało się pobrać rozmów.

                <br><br>

                <small>
                    ${escapeHtml(error.message)}
                </small>

            </div>

        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">Brak rozmów.</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(
        conversation => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation";


            if (
                conversation.id ===
                currentConversationId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "conversation-name";


            name.textContent =
                "👤 " +
                (
                    conversation.name ||
                    "Uczeń"
                );


            const date =
                document.createElement(
                    "div"
                );


            date.className =
                "conversation-date";


            if (
                conversation.created_at
            ) {

                date.textContent =
                    new Date(
                        conversation.created_at
                    ).toLocaleString(
                        "pl-PL"
                    );

            }


            item.appendChild(name);

            item.appendChild(date);


            item.addEventListener(
                "click",
                function() {

                    openConversation(
                        conversation
                    );

                }
            );


            list.appendChild(item);

        }
    );

}


// ==================================================
// OTWIERANIE ROZMOWY
// ==================================================

async function openConversation(
    conversation
) {

    currentConversationId =
        conversation.id;


    currentConversationClosed =
        conversation.closed === true;


    document.getElementById(
        "chatTitle"
    ).textContent =
        "💬 " +
        (
            conversation.name ||
            "Uczeń"
        );


    document.getElementById(
        "chatStatus"
    ).textContent =
        currentConversationClosed
            ? "🔒 Zamknięta"
            : "🟢 Aktywna";


    const closeButton =
        document.getElementById(
            "closeConversationButton"
        );


    if (
        currentConversationClosed
    ) {

        closeButton.style.display =
            "none";

    } else {

        closeButton.style.display =
            "block";

    }


    await loadMessages();


    await loadConversations();

}


// ==================================================
// POBIERANIE WIADOMOŚCI
// ==================================================

async function loadMessages() {

    const messages =
        document.getElementById(
            "messages"
        );


    if (!currentConversationId) {

        return;

    }


    messages.innerHTML =
        '<div class="loading">Ładowanie wiadomości...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("help_messages")
            .select("*")
            .eq(
                "conversation_id",
                currentConversationId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Błąd wiadomości:",
            error
        );


        messages.innerHTML = `

            <div class="empty">

                ❌ Nie udało się pobrać wiadomości.

                <br><br>

                <small>
                    ${escapeHtml(error.message)}
                </small>

            </div>

        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        messages.innerHTML = `

            <div class="no-chat">

                <div>

                    <div style="font-size:45px;">
                        💬
                    </div>

                    <p>
                        Brak wiadomości.
                    </p>

                </div>

            </div>

        `;

    } else {

        messages.innerHTML = "";


        data.forEach(
            message => {

                const item =
                    document.createElement(
                        "div"
                    );


                const isSecretary =
                    message.sender ===
                    "secretariat";


                item.className =
                    "message " +
                    (
                        isSecretary
                            ? "secretary"
                            : "student"
                    );


                const author =
                    document.createElement(
                        "div"
                    );


                author.className =
                    "message-author";


                author.textContent =
                    isSecretary
                        ? "Sekretariat"
                        : "Uczeń";


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "message-text";


                text.textContent =
                    message.message ||
                    "";


                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "message-date";


                if (
                    message.created_at
                ) {

                    date.textContent =
                        new Date(
                            message.created_at
                        ).toLocaleString(
                            "pl-PL"
                        );

                }


                item.appendChild(
                    author
                );

                item.appendChild(
                    text
                );

                item.appendChild(
                    date
                );


                messages.appendChild(
                    item
                );

            }
        );

    }


    messages.scrollTop =
        messages.scrollHeight;


    updateChatInput();

}


// ==================================================
// POKAZYWANIE POLA ODPOWIEDZI
// ==================================================

function updateChatInput() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const closed =
        document.getElementById(
            "closedMessage"
        );


    if (
        !currentConversationId
    ) {

        input.style.display =
            "none";

        closed.style.display =
            "none";

        return;

    }


    if (
        currentConversationClosed
    ) {

        input.style.display =
            "none";

        closed.style.display =
            "block";

    } else {

        input.style.display =
            "flex";

        closed.style.display =
            "none";

    }

}


// ==================================================
// WYSYŁANIE WIADOMOŚCI
// ==================================================

document
    .getElementById(
        "sendButton"
    )
    .addEventListener(
        "click",
        sendMessage
    );


document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


async function sendMessage() {

    if (
        !currentConversationId
    ) {

        return;

    }


    if (
        currentConversationClosed
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const button =
        document.getElementById(
            "sendButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Wysyłanie...";


    const {
        error
    } =
        await supabaseClient
            .from("help_messages")
            .insert({

                conversation_id:
                    currentConversationId,

                message:
                    text,

                sender:
                    "secretariat"

            });


    button.disabled =
        false;


    button.textContent =
        "Wyślij";


    if (error) {

        alert(
            "❌ Nie udało się wysłać wiadomości:\n" +
            error.message
        );

        return;

    }


    input.value = "";


    await loadMessages();

}


// ==================================================
// ZAMYKANIE ROZMOWY
// ==================================================

document
    .getElementById(
        "closeConversationButton"
    )
    .addEventListener(
        "click",
        closeConversation
    );


async function closeConversation() {

    if (
        !currentConversationId
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Czy na pewno chcesz zamknąć tę rozmowę?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("help_conversations")
            .update({
                closed: true
            })
            .eq(
                "id",
                currentConversationId
            );


    if (error) {

        alert(
            "❌ Nie udało się zamknąć rozmowy:\n" +
            error.message
        );

        return;

    }


    currentConversationClosed =
        true;


    document.getElementById(
        "chatStatus"
    ).textContent =
        "🔒 Zamknięta";


    document.getElementById(
        "closeConversationButton"
    ).style.display =
        "none";


    updateChatInput();


    await loadConversations();

}


// ==================================================
// WYLOGOWANIE
// ==================================================

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "logowanie.html";

        }
    );


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// ==================================================
// START
// ==================================================

async function start() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {

        return;

    }


    await loadConversations();

}


start();


// ==================================================
// AUTOMATYCZNE ODŚWIEŻANIE
// ==================================================

setInterval(
    async function() {

        await loadConversations();


        if (
            currentConversationId
        ) {

            await loadMessages();

        }

    },
    5000
);

</script>

</body>

</html>
