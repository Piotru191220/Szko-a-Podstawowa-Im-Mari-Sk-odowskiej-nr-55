<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://vqilsuvpinnfmngrczlj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cm_bvcrH6LCOaPz790GfTg_hwobP-3I";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ZMIENNE I ZAPIS SESJI
========================= */

const STORAGE_KEY = "school_help_active_chat";

let nickname = "";
let conversationId = null;
let isSending = false;
let isCheckingChat = false;

function saveSession() {
    if (!conversationId || !nickname) return;

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            conversationId: conversationId,
            nickname: nickname
        })
    );
}

function clearSession() {
    localStorage.removeItem(STORAGE_KEY);

    conversationId = null;
    nickname = "";
}

function showNameForm() {
    document.getElementById("nameBox").style.display = "block";
    document.getElementById("chatBox").style.display = "none";
}

function showChat() {
    document.getElementById("nameBox").style.display = "none";
    document.getElementById("chatBox").style.display = "block";
    document.getElementById("userName").textContent = nickname;
}


/* =========================
   PRZYWRACANIE ROZMOWY
   PO F5 LUB PONOWNYM WEJŚCIU
========================= */

async function restoreSession() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        showNameForm();
        return;
    }

    let session;

    try {
        session = JSON.parse(saved);
    } catch (error) {
        clearSession();
        showNameForm();
        return;
    }

    if (!session.conversationId || !session.nickname) {
        clearSession();
        showNameForm();
        return;
    }

    conversationId = session.conversationId;
    nickname = session.nickname;

    document.getElementById("nameMessage").textContent =
        "⏳ Przywracanie rozmowy...";

    try {
        const { data, error } = await supabaseClient
            .from("help_conversations")
            .select("id, nickname, status")
            .eq("id", conversationId)
            .maybeSingle();

        if (error) {
            throw error;
        }

        // Rozmowa nie istnieje albo została zamknięta.
        if (!data || data.status === "closed") {
            clearSession();
            showNameForm();

            document.getElementById("nameMessage").textContent =
                "ℹ️ Poprzednia rozmowa została zamknięta. Możesz rozpocząć nową.";

            document.getElementById("nameMessage").style.color =
                "#1769e0";

            return;
        }

        // Pobieramy pseudonim zapisany w bazie.
        nickname = data.nickname;
        saveSession();

        showChat();
        await loadMessages();

    } catch (error) {
        console.error("Błąd przywracania rozmowy:", error);

        document.getElementById("nameMessage").textContent =
            "❌ Nie udało się sprawdzić rozmowy. Odśwież stronę za chwilę.";

        document.getElementById("nameMessage").style.color = "red";

        // Nie usuwamy sesji przy błędzie sieci.
        // Dzięki temu użytkownik nie straci zapisanej rozmowy.
        showNameForm();
    }
}


/* =========================
   ROZPOCZĘCIE NOWEJ ROZMOWY
========================= */

document.getElementById("startButton")
.addEventListener("click", async function () {

    const input = document.getElementById("nickname");
    const message = document.getElementById("nameMessage");
    const button = document.getElementById("startButton");

    // Nie twórz drugiej rozmowy podczas zapisywania pierwszej.
    if (button.disabled) return;

    nickname = input.value.trim();

    if (!nickname) {
        message.textContent = "❌ Wpisz imię lub pseudonim.";
        message.style.color = "red";
        return;
    }

    if (nickname.length < 2) {
        message.textContent = "❌ Imię lub pseudonim jest za krótki.";
        message.style.color = "red";
        return;
    }

    button.disabled = true;
    message.textContent = "⏳ Otwieranie rozmowy...";
    message.style.color = "#1769e0";

    try {
        const { data, error } = await supabaseClient
            .from("help_conversations")
            .insert({
                nickname: nickname,
                status: "open"
            })
            .select()
            .single();

        if (error) throw error;

        conversationId = data.id;

        // Zapisujemy od razu, zanim użytkownik odświeży stronę.
        saveSession();

        showChat();

        message.textContent = "";

        await loadMessages();

    } catch (error) {
        console.error("Błąd rozpoczynania rozmowy:", error);

        message.textContent =
            "❌ Nie udało się rozpocząć rozmowy. Spróbuj ponownie.";

        message.style.color = "red";

    } finally {
        button.disabled = false;
    }
});


/* =========================
   SPRAWDZANIE, CZY CZAT
   NADAL JEST OTWARTY
========================= */

async function checkChatStatus() {
    if (!conversationId || isCheckingChat) return;

    isCheckingChat = true;

    try {
        const { data, error } = await supabaseClient
            .from("help_conversations")
            .select("id, status")
            .eq("id", conversationId)
            .maybeSingle();

        if (error) throw error;

        if (!data || data.status === "closed") {
            clearSession();
            showNameForm();

            document.getElementById("nameMessage").textContent =
                "ℹ️ Ta rozmowa została zamknięta przez sekretariat.";

            document.getElementById("nameMessage").style.color =
                "#1769e0";
        }

    } catch (error) {
        // Chwilowy problem z internetem nie zamyka lokalnej sesji.
        console.error("Nie udało się sprawdzić statusu rozmowy:", error);

    } finally {
        isCheckingChat = false;
    }
}


/* =========================
   POBIERANIE WIADOMOŚCI
========================= */

async function loadMessages() {
    if (!conversationId) return;

    const messages = document.getElementById("messages");

    const { data, error } = await supabaseClient
        .from("help_messages")
        .select("*")
        .eq("conversation_id", conversationId)
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Błąd pobierania wiadomości:", error);

        messages.innerHTML =
            "<p>❌ Nie udało się pobrać wiadomości.</p>";

        return;
    }

    // Na wypadek gdy rozmowa została zamknięta
    // podczas pobierania wiadomości.
    if (!conversationId) return;

    messages.innerHTML = "";

    if (!data || data.length === 0) {
        messages.innerHTML =
            "<p style='color:#777'>Napisz pierwszą wiadomość.</p>";

        return;
    }

    data.forEach(item => {
        const div = document.createElement("div");
        div.className = "chat-message";

        if (item.sender === "secretariat") {
            div.classList.add("secretariat");
        }

        const sender = document.createElement("strong");

        sender.textContent =
            item.sender === "secretariat"
                ? "🏫 Sekretariat"
                : nickname;

        const text = document.createElement("div");
        text.textContent = item.message;

        const date = document.createElement("span");
        date.className = "chat-date";

        date.textContent = new Date(
            item.created_at
        ).toLocaleString("pl-PL");

        div.appendChild(sender);
        div.appendChild(text);
        div.appendChild(date);

        messages.appendChild(div);
    });

    messages.scrollTop = messages.scrollHeight;
}


/* =========================
   WYSYŁANIE WIADOMOŚCI
========================= */

document.getElementById("sendButton")
.addEventListener("click", async function () {

    const input = document.getElementById("messageInput");
    const status = document.getElementById("sendMessage");
    const button = document.getElementById("sendButton");

    const text = input.value.trim();

    if (isSending) return;

    if (!text) {
        status.textContent = "❌ Wpisz wiadomość.";
        status.style.color = "red";
        return;
    }

    if (!conversationId) {
        status.textContent = "❌ Rozmowa nie jest aktywna.";
        status.style.color = "red";
        return;
